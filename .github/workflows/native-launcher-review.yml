name: Native D-drive launcher review
on:
  push:
    branches: [astra/review-v6-windows-launcher]
    paths: ['ci/**', '.github/workflows/native-launcher-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Obtain and verify official engine
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force native-review,engine | Out-Null
          $url='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing $url -OutFile engine.zip
          $hash=(Get-FileHash engine.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') { throw 'Engine checksum mismatch' }
          Expand-Archive engine.zip engine
          Copy-Item ci/launcher-under-test.ps1 native-review/tested-launcher.ps1
          Copy-Item ci/validate-installation.gd native-review/tested-validator.gd
          $hash | Set-Content native-review/engine-archive-sha256.txt
      - name: Build minimal import fixture, not the wrestling game
        shell: python
        run: |
          import json, struct, shutil
          from pathlib import Path
          root=Path('D:/lolcow-wrestling')
          (root/'assets/models').mkdir(parents=True,exist_ok=True)
          (root/'tools').mkdir(exist_ok=True)
          shutil.copyfile('ci/validate-installation.gd',root/'tools/validate_installation.gd')
          (root/'project.godot').write_text('config_version=5\n[application]\nconfig/name="Launcher Import Fixture"\nrun/main_scene="res://probe.tscn"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n')
          (root/'probe.gd').write_text('extends Node\nfunc _ready():\n\tFileAccess.open("res://GAME_WAS_STARTED.txt",FileAccess.WRITE).store_string("started")\n\tget_tree().quit()\n')
          (root/'probe.tscn').write_text('[gd_scene load_steps=2 format=3]\n[ext_resource type="Script" path="res://probe.gd" id="1"]\n[node name="Probe" type="Node"]\nscript=ExtResource("1")\n')
          binary=struct.pack('<9f',0,0,0,1,0,0,0,1,0)
          doc={'asset':{'version':'2.0'},'scene':0,'scenes':[{'nodes':[0]}],'nodes':[{'mesh':0}],'meshes':[{'primitives':[{'attributes':{'POSITION':0}}]}],'buffers':[{'byteLength':len(binary)}],'bufferViews':[{'buffer':0,'byteOffset':0,'byteLength':len(binary),'target':34962}],'accessors':[{'bufferView':0,'componentType':5126,'count':3,'type':'VEC3','min':[0,0,0],'max':[1,1,0]}]}
          js=json.dumps(doc,separators=(',',':')).encode(); js+=b' '*(-len(js)%4)
          glb=struct.pack('<4sII',b'glTF',2,28+len(js)+len(binary))+struct.pack('<I4s',len(js),b'JSON')+js+struct.pack('<I4s',len(binary),b'BIN\0')+binary
          for name in ['tophiachu','novaonline','cyraxx','candy_rooks','andy_ditch','jupiter_the_hybrid','anacondasin','daniel_larson','referee_cobra','ring_arena']:
              (root/'assets/models'/(name+'.glb')).write_bytes(glb)
      - name: Execute validation and failure paths on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $workspace=(Get-Location).Path
          $launcher=Join-Path $workspace 'ci/launcher-under-test.ps1'
          $evidence=Join-Path $workspace 'native-review'
          $env:GODOT_BIN=(Get-ChildItem engine -Filter '*win64_console.exe' | Select-Object -First 1).FullName
          if (-not $env:GODOT_BIN) { throw 'No console executable' }
          $validEngine=$env:GODOT_BIN
          $cases=New-Object System.Collections.ArrayList
          function Probe([string]$name,[string]$root,[int]$expected,[string]$needle) {
              $args='-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$launcher+'" -ProjectRoot "'+$root+'" -ValidateOnly'
              $stdout=Join-Path $evidence ($name+'-stdout.log')
              $stderr=Join-Path $evidence ($name+'-stderr.log')
              $p=Start-Process powershell.exe -ArgumentList $args -WorkingDirectory 'C:\Windows\Temp' -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $text=Get-Content $stdout -Raw
              $ok=$p.ExitCode -eq $expected -and $text.Contains($needle)
              [void]$cases.Add(@{name=$name;exit_code=$p.ExitCode;expected=$expected;passed=$ok;root=$root})
              $cases | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $evidence 'cases.json')
              if (Test-Path -LiteralPath (Join-Path $root '.launch-logs')) { Copy-Item -LiteralPath (Join-Path $root '.launch-logs') -Destination (Join-Path $evidence ($name+'-engine-logs')) -Recurse -Force }
              if (-not $ok) { Get-Content $stdout,$stderr; throw ('Case failed: '+$name) }
          }
          Probe 'd-drive-from-other-cwd' 'D:\lolcow-wrestling' 0 'Validation completed'
          if (-not (Test-Path 'D:\lolcow-wrestling\.godot')) { throw 'Import cache in wrong place' }
          if (Test-Path 'D:\lolcow-wrestling\GAME_WAS_STARTED.txt') { throw 'ValidateOnly started gameplay' }
          Copy-Item 'D:\lolcow-wrestling' 'D:\launcher review space' -Recurse
          Probe 'quoted-path-with-spaces' 'D:\launcher review space' 0 'Validation completed'
          Probe 'missing-project' 'D:\absent-review-project' 1 'Missing project.godot'
          $env:GODOT_BIN='D:\no-such-engine.exe'
          Probe 'invalid-explicit-engine' 'D:\lolcow-wrestling' 1 'GODOT_BIN is invalid'
          $env:GODOT_BIN=$validEngine
          Remove-Item 'D:\launcher review space\assets\models\cyraxx.glb'
          Probe 'partial-extraction' 'D:\launcher review space' 1 'Missing model: cyraxx'
          Copy-Item 'D:\lolcow-wrestling\assets\models\cyraxx.glb' 'D:\launcher review space\assets\models\cyraxx.glb'
          'this is intentionally invalid GDScript' | Set-Content 'D:\launcher review space\probe.gd'
          Probe 'script-error-blocks-start' 'D:\launcher review space' 1 'Runtime validation failed'
          if (Test-Path 'D:\launcher review space\GAME_WAS_STARTED.txt') { throw 'Rejected fixture started gameplay' }
          @{
              scope='Native PowerShell 5.1 launcher validation against a minimal import fixture. NOT a full wrestling-game or graphical Windows playtest.'
              passed=$cases.Count
              launcher_sha256=(Get-FileHash $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
              validator_sha256=(Get-FileHash 'ci/validate-installation.gd' -Algorithm SHA256).Hash.ToLowerInvariant()
              windows=[Environment]::OSVersion.VersionString
              powershell=$PSVersionTable.PSVersion.ToString()
              engine_sha256=(Get-FileHash $validEngine -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content (Join-Path $evidence 'report.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-launcher-review
          path: native-review/
          retention-days: 14
