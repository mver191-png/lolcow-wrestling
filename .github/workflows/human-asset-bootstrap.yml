name: Human topology art sources
on:
  push:
    branches: [astra/human-topology-visual-v5]
    paths: [.github/workflows/human-asset-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtain licensed upstream art without running upstream code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          curl --fail --location --retry 3 --max-time 180 https://github.com/makehumancommunity/makehuman/archive/a8bc2d54ff0ac92e78ff71431b1023eda42bf482.zip -o sources/makehuman-pinned.zip
          curl --fail --location --retry 3 --max-time 300 https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o sources/makehuman-system-cc0.zip
          curl --fail --location --retry 3 --max-time 60 https://static.makehumancommunity.org/assets/assetpacks/makehuman_system_assets.html -o sources/system-license-source.html
          curl --fail --location --retry 3 --max-time 60 https://static.makehumancommunity.org/mpfb/faq/use_in_closed_source.html -o sources/core-license-source.html
          (cd sources && sha256sum *.zip *.html > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: human-topology-sources
          path: sources/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
