name: Game quality
on:
  pull_request:
  push:
    branches: [main, astra/character-animation-overhaul, astra/recovery-contact-followup, astra/model-quality-v3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
      GODOT_SILENCE_ROOT_WARNING: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build deterministic roster and validate source
        run: |
          set -euo pipefail
          mkdir -p evidence
          touch evidence/.gdignore
          python3 -m py_compile tools/*.py tests/*.py
          python3 tools/build_roster.py 2>&1 | tee evidence/asset-build.log
          python3 tests/test_roster_assets.py 2>&1 | tee evidence/assets-tests.log
          python3 tools/audit_portrait_seams.py > evidence/head-seams.json
      - name: Install the pinned project engine
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .tools/godot.zip
          unzip -q .tools/godot.zip -d .tools
          mv .tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64 .tools/godot
          chmod +x .tools/godot
          .tools/godot --version | tee evidence/engine-version.txt
      - name: Validate integrated gameplay, deformation and whole matches
        run: |
          set -euo pipefail
          .tools/godot --headless --editor --path . --import 2>&1 | tee evidence/import.log
          for suite in test_suite test_pin_balance_scene test_visual_presentation test_overhaul test_contacts test_animation_polish test_contact_acceptance test_authored_moves test_clearance test_joint_deformation test_likeness_assets test_review_regressions test_cpu_review test_action_camera; do
            .tools/godot --headless --fixed-fps 60 --path . -s "tests/${suite}.gd" 2>&1 | tee "evidence/${suite}.log"
          done
          .tools/godot --headless --fixed-fps 60 --path . -s tools/soak_match.gd 2>&1 | tee evidence/whole-matches.log
          .tools/godot --headless --disable-render-loop --fixed-fps 60 --path . -s tools/audit_match_pacing.gd -- --limit=128 2>&1 | tee evidence/pacing.log
          .tools/godot --headless --disable-render-loop --fixed-fps 60 --path . -s tools/audit_match_pacing.gd -- --limit=16 --noise=7 --output=res://evidence/pacing-noise.json 2>&1 | tee evidence/pacing-noise.log
          python3 - <<'PACING'
          import json
          from pathlib import Path
          normal=json.loads(Path('evidence/pacing.json').read_text())['matches']
          noise=json.loads(Path('evidence/pacing-noise.json').read_text())['matches']
          assert len(normal)==128 and len(noise)==16
          assert all(a['event_digest']==b['event_digest'] and a['ticks']==b['ticks'] for a,b in zip(normal,noise))
          print('Cosmetic-noise parity verified; observed timeouts:',sum(m['timeout'] for m in normal))
          PACING
          if grep -E 'SCRIPT ERROR:|Parse Error:|Unicode parsing error|\[FAIL\]' evidence/*.log; then
            echo 'Script or assertion failure.' >&2
            exit 1
          fi
      - name: Render actual models, bend studies and match sequence
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          for capture in capture_contact_acceptance capture_model_quality capture_deformation capture_integrated_match capture_likeness capture_self_review capture_cpu_review; do
            xvfb-run -a .tools/godot --path . --audio-driver Dummy --rendering-method gl_compatibility --disable-render-loop --fixed-fps 60 -s "tools/${capture}.gd" 2>&1 | tee "evidence/${capture}.log"
          done
          xvfb-run -a .tools/godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 -s tools/capture_selection_review.gd 2>&1 | tee evidence/capture_selection_review.log
          if grep -E 'ERROR:|Parse Error:|\[FAIL\]' evidence/capture_*.log; then
            echo 'Rendered smoke test failed.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence')
          models=json.loads((root/'model-quality/capture-manifest.json').read_text())
          bends=json.loads((root/'deformation-renders/manifest.json').read_text())
          assert len(models)==51 and len({e['character'] for e in models})==9
          portraits=json.loads((root/'likeness/capture-manifest.json').read_text())
          assert len(portraits)==36 and len({e['character'] for e in portraits})==9
          assert all((root/'likeness'/Path(e['file']).name).stat().st_size>10000 for e in portraits)
          assert len(bends)==24 and len({e['character'] for e in bends})==8
          for entries,folder in [(models,'model-quality'),(bends,'deformation-renders')]:
              assert all((root/folder/Path(e['file']).name).stat().st_size>10000 for e in entries)
          assert len(list((root/'integrated-match/frames').glob('*.png')))==173
          assert (root/'contact-acceptance-after/official-third-count-clean.png').stat().st_size>10000
          seams=json.loads((root/'head-seams.json').read_text())['current']
          assert len(seams)==9 and all(e['seam_pairs']==97 and e['maximum_gap_m']<1e-7 and e['maximum_normal_difference']<1e-6 for e in seams)
          assert (root/'self-review/renders/selection-normal-loop.png').stat().st_size>10000
          print('Verified 36 portrait-study views, 51 roster views, 24 bend views, 173 match frames and final-count capture')
          PY
      - name: Package exact source, compiled models and verification evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          root=Path.cwd();out=root/'review-package';out.mkdir(exist_ok=True)
          names=['.gitignore','project.godot','README.md','REVIEW.md','STATE.md','KNOWN_ISSUES.md','NEXT_TASK.md','START_GAME.bat','CODEBASE_FOR_GPT_PRO.md','DECISIONS.md','GEMINI_GRAPHICS_ANIMATION_MASTER_PROMPT.md']
          files=[root/name for name in names]
          for folder in ['.github','scripts','scenes','tests','tools','blender','docs','assets/models','evidence']:
              files.extend(p for p in (root/folder).rglob('*') if p.is_file())
          manifest={}
          for p in files:
              if not p.is_file() or '__pycache__' in p.parts or p.suffix in ['.pyc','.import'] or p.name.endswith('_woven.png'):continue
              name=p.relative_to(root).as_posix();target=out/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target);manifest[name]=hashlib.sha256(target.read_bytes()).hexdigest()
          (out/'source-manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Packaged',len(manifest),'files. Check the job result before treating an artifact as validated.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-review-${{ github.sha }}
          path: review-package/
          include-hidden-files: true
          retention-days: 7
