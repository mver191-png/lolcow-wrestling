name: Portrait workbench
on:
  push:
    branches: [astra/model-quality-v3]
    paths: [.github/workflows/portrait-workbench.yml]
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Retrieve public episode cover for visual study only
        run: |
          mkdir -p workbench
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from html.parser import HTMLParser
          from pathlib import Path
          import json,html
          root=Path('workbench')
          url='https://open.spotify.com/episode/2EpxP1PWU3fHsPguvZ9cOZ'
          def read(url):
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as r:return r.read(8_000_000)
          class Meta(HTMLParser):
              def __init__(self):super().__init__();self.image=None;self.title=None
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='meta' and d.get('property')=='og:image':self.image=d.get('content')
                  if tag=='meta' and d.get('property')=='og:title':self.title=d.get('content')
          text=read(url).decode('utf-8','replace');m=Meta();m.feed(text)
          (root/'page.html').write_text(text)
          if m.image:(root/'jupiter-cover.jpg').write_bytes(read(html.unescape(m.image)))
          (root/'manifest.json').write_text(json.dumps({'page':url,'image':m.image,'title':m.title},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: additional-portrait-study
          path: workbench/
          retention-days: 1
